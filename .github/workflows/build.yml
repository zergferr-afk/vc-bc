name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The GitHub runner image already ships the Android SDK (ANDROID_HOME is set);
      # the Android Gradle plugin downloads any missing platform or build tools itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: my-qr-card-apk
          path: app/build/outputs/apk/release/*.apk
